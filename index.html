<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESHA & MARO GAMES - Auth System</title>
    <!-- مكتبة Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ملف الستايل -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- ================= 1. شاشة تسجيل الدخول وإنشاء الحساب ================= -->
        <section id="auth-screen" class="screen active">
            <div class="brand-header">
                <h1 class="glitch-title">DESHA & MARO</h1>
                <p class="tagline">FOOTBALL ENGINE</p>
            </div>

            <div class="card auth-card">
                <h2 class="card-title" id="auth-title"><i class="fa-solid fa-user-plus"></i> إنشاء حساب جديد</h2>

                <!-- صندوق إظهار الرسائل والأخطاء -->
                <div id="auth-message" class="message-box"></div>

                <!-- نموذج الإدخال (تم إلغاء onsubmit الافتراضي) -->
                <form id="auth-form" onsubmit="return false;">
                    <!-- 1. اسم المستخدم -->
                    <div class="input-group" id="username-group">
                        <label for="auth-username"><i class="fa-solid fa-user"></i> اسم المستخدم (Username):</label>
                        <input type="text" id="auth-username" required placeholder="مثال: desha_king" autocomplete="off">
                        <small class="hint">سيُستخدم للبحث عنك في المواجهات الأونلاين</small>
                    </div>

                    <!-- 2. البريد الإلكتروني -->
                    <div class="input-group">
                        <label for="auth-email"><i class="fa-solid fa-envelope"></i> البريد الإلكتروني:</label>
                        <input type="email" id="auth-email" required placeholder="name@example.com">
                    </div>

                    <!-- 3. كلمة السر -->
                    <div class="input-group">
                        <label for="auth-password"><i class="fa-solid fa-lock"></i> كلمة السر:</label>
                        <input type="password" id="auth-password" required placeholder="••••••••">
                    </div>

                    <!-- زر الإرسال تم تحويله إلى type="button" لمنع إعادة تحميل الصفحة -->
                    <button type="button" id="auth-submit-btn" class="btn btn-red" onclick="handleAuthSubmit()">
                        <i class="fa-solid fa-check-circle"></i> إنشاء الحساب وتأكيد
                    </button>
                </form>

                <div class="footer-link" id="footer-link">
                    <p>لديك حساب بالفعل؟ <a href="javascript:void(0)" onclick="toggleMode('login')">تسجيل الدخول</a></p>
                </div>
            </div>
        </section>

        <!-- ================= 2. الشاشة الرئيسية بعد تسجيل الدخول ================= -->
        <section id="main-screen" class="screen">
            <div class="card dashboard-card">
                <div class="user-header">
                    <i class="fa-solid fa-circle-user avatar"></i>
                    <h2 id="user-display-username">مرحباً بك!</h2>
                    <p id="user-display-email" class="email-label">---</p>
                </div>

                <div class="status-box">
                    <p><i class="fa-solid fa-check-circle"></i> تم تسجيل الدخول بنجاح!</p>
                </div>

                <button class="btn btn-red-outline" onclick="logout()">
                    <i class="fa-solid fa-power-off"></i> تسجيل الخروج
                </button>
            </div>
        </section>
    </div>

    <!-- ملف الجافاسكريبت -->
    <script src="gameEngine.js"></script>
</body>
</html>
